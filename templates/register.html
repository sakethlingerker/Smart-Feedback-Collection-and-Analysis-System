<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Feedback Collection and Analysis System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Smart Feedback Collection and Analysis System</h1>
                <p>Create your account</p>
            </div>
        </header>

        <main class="main-content">
            <div class="feedback-form-container">
                <div class="form-header">
                    <h2>Register</h2>
                    <p>Join our feedback community and track your submissions</p>
                </div>

                <form id="registerForm" class="feedback-form">
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password (min. 6 characters)" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password:</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="submit-btn" id="registerBtn">
                            <span class="btn-text">Register</span>
                            <span class="btn-loading" style="display: none;">
                                <span class="loading-spinner"></span>
                                Creating account...
                            </span>
                        </button>
                    </div>

                    <div class="auth-links">
                        <p>Already have an account? <a href="{{ url_for('login_page') }}l">Login here</a></p>
                        <p><a href="{{ url_for('index') }}">← Back to home</a></p>
                    </div>
                </form>

                <div id="responseMessage" class="response-message"></div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-info">
                <p>Powered by Hugging Face AI • Built with Flask & Modern Web Technologies</p>
            </div>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const submitBtn = document.getElementById('registerBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoading = submitBtn.querySelector('.btn-loading');
        const responseMessage = document.getElementById('responseMessage');
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        
        // Basic validation
        if (password !== confirmPassword) {
            showError('Passwords do not match!');
            return;
        }
        
        if (password.length < 6) {
            showError('Password must be at least 6 characters long!');
            return;
        }
        
        if (!email || !email.includes('@')) {
            showError('Please enter a valid email address!');
            return;
        }
        
        submitBtn.disabled = true;
        btnText.style.display = 'none';
        btnLoading.style.display = 'flex';
        
        // Hide any previous messages
        if (responseMessage) {
            responseMessage.style.display = 'none';
        }
        
        const result = await window.authManager.register(email, password);
        
        if (result.success) {
            showSuccess('Registration successful! Redirecting...');
            
            // Redirect to appropriate page
            setTimeout(() => {
                if (result.user.role === 'admin') {
                    window.location.href = '{{ url_for('dashboard_page') }}';
                } else {
                    window.location.href = '{{ url_for('index') }}';
                }
            }, 1500);
        } else {
            // Show the actual error message from the server
            showError(result.error || 'Registration failed. Please try again.');
        }
        
        submitBtn.disabled = false;
        btnText.style.display = 'flex';
        btnLoading.style.display = 'none';
    });

    // Helper functions to show messages
    function showError(message) {
        const responseMessage = document.getElementById('responseMessage');
        if (responseMessage) {
            responseMessage.textContent = message;
            responseMessage.className = 'response-message error';
            responseMessage.style.display = 'block';
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                responseMessage.style.display = 'none';
            }, 5000);
        } else {
            alert('Error: ' + message);
        }
    }

    function showSuccess(message) {
        const responseMessage = document.getElementById('responseMessage');
        if (responseMessage) {
            responseMessage.textContent = message;
            responseMessage.className = 'response-message success';
            responseMessage.style.display = 'block';
        } else {
            alert('Success: ' + message);
        }
    }
</script>
</body>
</html>
